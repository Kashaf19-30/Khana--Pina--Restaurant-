<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Khana Pina</title>

    <link rel="stylesheet" type="text/css" href="../css/style.css">

   
</head>

<body class="contact-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="contact-header">

        <div class="logo">

            <img
                src="../img/logo.jpg.jfif"
                alt="Khana Pina Logo"
            >

        </div>

        <nav>

            <a href="../index.html">Home</a>

            <a href="About.html">About</a>

            <a href="contact.html" class="active">Contact</a>

        </nav>

    </header>


    <!-- =========================
         CONTACT SECTION
    ========================== -->

    <section class="contact-section">

    <div class="contact-info">

        <h1>Contact Us</h1>

        <p>
            We would love to hear from you!
            If you have any questions, suggestions,
            or feedback, feel free to contact us.
        </p>

    

    </div>



</section>

            <!-- CONTACT IMAGE -->

            
        </div>


        <!-- =========================
             CONTACT FORM
        ========================== -->

        <div class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Write your message here..."
                        required
                    ></textarea>

                </div>


                <!-- SUBMIT BUTTON -->

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="contact-footer">

        <p>
            &copy; 2026 Khana Pina.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
